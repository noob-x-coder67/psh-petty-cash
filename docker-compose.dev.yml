services:
  db:
    build:
      context: docker/postgres
    image: psh-postgres:17.10-pg_uuidv7-1.6
    environment:
      POSTGRES_USER: psh
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: psh_petty_cash
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
