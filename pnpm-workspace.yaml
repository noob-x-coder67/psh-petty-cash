packages:
  - "apps/*"
  - "packages/*"
# Forces patched versions of two vulnerable transitive deps buried in exceljs's own
# dependency tree (archiver/unzipper/uuid) — brace-expansion DoS (GHSA-mh99-v99m-4gvg)
# and uuid's missing buffer bounds check (GHSA-w5hq-g745-h8pq). Both are stable, narrow
# utility APIs; safe to force outside exceljs's own declared ranges. Revisit if exceljs
# ships a release that pulls these in natively.
overrides:
  brace-expansion: ">=5.0.8"
  uuid: ">=11.1.1"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - '@turbo/darwin-64@2.10.7'
  - '@turbo/darwin-arm64@2.10.7'
  - '@turbo/linux-64@2.10.7'
  - '@turbo/linux-arm64@2.10.7'
  - '@turbo/windows-64@2.10.7'
  - '@turbo/windows-arm64@2.10.7'
  - next@16.2.12
  - turbo@2.10.7
# 2026-07-29: these 4 advisories are all inside next@16.2.12's own vendored sharp/postcss
# (confirmed via `pnpm why sharp`/`pnpm why postcss` — apps/web>next>sharp,
# apps/web>next>postcss), not our own declared dependency versions (apps/api's direct
# sharp and apps/web's direct postcss devDependency are both already patched). Not
# safely fixable via an override without risking breaking Next's internal image-
# optimization/build pipeline — unfixable here until Next.js ships a release with
# updated internal deps. Revisit this list on the next Next.js upgrade.
#   GHSA-f88m-g3jw-g9cj — sharp/libvips (high)
#   GHSA-6g55-p6wh-862q — postcss arbitrary file read via sourceMappingURL (high)
#   GHSA-r28c-9q8g-f849 — postcss path traversal via source-map auto-loading (high)
#   GHSA-qx2v-qp2m-jg93 — postcss XSS via unescaped </style> in stringify output (moderate)
auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-6g55-p6wh-862q
    - GHSA-r28c-9q8g-f849
    - GHSA-qx2v-qp2m-jg93
